name: XrmQuery CI

on:
  pull_request:
    paths:
      - "src/XrmQuery/**"
      - ".github/workflows/npm-ci.yml"
  push:
    branches: [main]
    paths:
      - "src/XrmQuery/**"
      - ".github/workflows/npm-ci.yml"

defaults:
  run:
    working-directory: src/XrmQuery

jobs:
  ci:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node-version: [20.x, 22.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: src/XrmQuery/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npx prettier --check .

      - name: Typecheck
        run: npm run typecheck

      - name: Typecheck against real XrmDefinitelyTyped output
        run: npm run typecheck:xdt

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
