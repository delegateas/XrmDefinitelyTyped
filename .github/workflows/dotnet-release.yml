name: Tool Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish, e.g. 0.1.0-preview.1"
        required: true
        type: string
      dry_run:
        description: "Build and pack, but do not push"
        type: boolean
        default: true
  push:
    tags: ["tool-v*"]

concurrency: tool-release

permissions:
  contents: write # create the GitHub Release for tag pushes
  id-token: write # required for NuGet trusted publishing (OIDC)

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          # Not global-json-file: setup-dotnet installs the literal version from
          # global.json and 404s if that exact SDK build was never published.
          # global.json still governs which SDK the build resolves to.
          dotnet-version: 10.x

      - name: Resolve version
        id: version
        env:
          # Via env, not direct interpolation: workflow_dispatch input is untrusted.
          VERSION_INPUT: ${{ inputs.version }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            version="$VERSION_INPUT"
          else
            version="${GITHUB_REF_NAME#tool-v}"
          fi

          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::'$version' is not a valid semver version"
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          case "$version" in
            *-*) echo "prerelease=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "prerelease=false" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Build
        run: dotnet build --configuration Release -p:Version=${{ steps.version.outputs.version }}

      - name: Test
        run: dotnet test --configuration Release --no-build

      - name: Pack
        run: dotnet pack src/XrmDefinitelyTyped.Tool --configuration Release --no-build -p:Version=${{ steps.version.outputs.version }} -o artifacts

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: nupkg-${{ steps.version.outputs.version }}
          path: artifacts/*

      # Trusted publishing: exchange the GitHub OIDC token for a NuGet API key
      # that is valid for 1 hour. Kept immediately before the push so it cannot
      # expire in between.
      - name: NuGet login (OIDC)
        if: ${{ github.event_name == 'push' || !inputs.dry_run }}
        uses: NuGet/login@v1
        id: nuget_login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push to NuGet
        if: ${{ github.event_name == 'push' || !inputs.dry_run }}
        run: >
          dotnet nuget push "artifacts/*.nupkg"
          --source https://api.nuget.org/v3/index.json
          --api-key ${{ steps.nuget_login.outputs.NUGET_API_KEY }}
          --skip-duplicate

      # Publishing from the Releases UI creates the tag, which triggers this
      # workflow, which then finds the release already there. Attach the packages
      # to it instead of failing, and leave its hand-written notes alone.
      - name: Create or update GitHub Release
        if: ${{ github.event_name == 'push' }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          TITLE: XrmDefinitelyTyped ${{ steps.version.outputs.version }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
        run: |
          upload() { gh release upload "$TAG" artifacts/*.nupkg --clobber; }

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; uploading packages to it."
            upload
            exit 0
          fi

          create_args=(--title "$TITLE" --generate-notes)
          if [ "$PRERELEASE" = "true" ]; then
            create_args+=(--prerelease)
          fi

          # Still guard the create: a release can appear between the check above
          # and this call (UI publish, or a concurrent run).
          if ! gh release create "$TAG" "${create_args[@]}" artifacts/*.nupkg; then
            echo "Create failed; assuming the release now exists and uploading instead."
            upload
          fi
