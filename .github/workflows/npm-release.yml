name: XrmQuery Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish, e.g. 0.1.0-preview.1"
        required: true
        type: string
      dry_run:
        description: "Build and pack, but do not publish"
        type: boolean
        default: true
  push:
    tags: ["xrmquery-v*"]

concurrency: xrmquery-release

permissions:
  contents: write # create the GitHub Release for tag pushes
  id-token: write # required for npm trusted publishing (OIDC) + provenance

defaults:
  run:
    working-directory: src/XrmQuery

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          # Trusted publishing needs Node >= 22.14.0.
          node-version: 22.x
          cache: npm
          cache-dependency-path: src/XrmQuery/package-lock.json
          # No registry-url on purpose: it writes an .npmrc line referencing
          # NODE_AUTH_TOKEN, which is unset under trusted publishing.
          # registry.npmjs.org is the default anyway.

      - name: Upgrade npm for trusted publishing
        # Node 22 bundles npm 10.x; OIDC publishing needs npm >= 11.5.1.
        run: |
          npm install -g npm@latest
          npm --version

      - name: Resolve version
        id: version
        env:
          # Via env, not direct interpolation: workflow_dispatch input is untrusted.
          VERSION_INPUT: ${{ inputs.version }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            version="$VERSION_INPUT"
          else
            version="${GITHUB_REF_NAME#xrmquery-v}"
          fi

          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::'$version' is not a valid semver version"
            exit 1
          fi

          # A prerelease must never take the 'latest' dist-tag, or every plain
          # `npm install` picks up the preview.
          case "$version" in
            *-*) dist_tag=next ;;
            *) dist_tag=latest ;;
          esac

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "dist_tag=$dist_tag" >> "$GITHUB_OUTPUT"
          echo "Publishing $(node -p "require('./package.json').name")@$version under dist-tag '$dist_tag'"

          npm version "$version" --no-git-tag-version --allow-same-version

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Inspect package contents
        run: npm pack --dry-run

      - name: Publish to npm
        if: ${{ github.event_name == 'push' || !inputs.dry_run }}
        # Trusted publishing: auth comes from the OIDC token via id-token: write,
        # and provenance attestations are generated automatically, so neither
        # NODE_AUTH_TOKEN nor --provenance is needed.
        run: npm publish --access public --tag "${{ steps.version.outputs.dist_tag }}"

      # Publishing from the Releases UI creates the tag, which triggers this
      # workflow, which then finds the release already there. Nothing to attach
      # here, so leave it as the human wrote it.
      - name: Create GitHub Release
        if: ${{ github.event_name == 'push' }}
        working-directory: ${{ github.workspace }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          TITLE: XrmQuery ${{ steps.version.outputs.version }}
          DIST_TAG: ${{ steps.version.outputs.dist_tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; nothing to do."
            exit 0
          fi

          create_args=(--title "$TITLE" --generate-notes)
          if [ "$DIST_TAG" = "next" ]; then
            create_args+=(--prerelease)
          fi

          # A release can appear between the check above and this call (UI
          # publish, or a concurrent run) -- do not fail the run over it.
          gh release create "$TAG" "${create_args[@]}" || gh release view "$TAG"
