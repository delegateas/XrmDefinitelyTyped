name: XrmQuery Release

on:
  push:
    tags: ["xrmquery-v*"]

concurrency: xrmquery-release

permissions:
  contents: read
  id-token: write # required for npm provenance

defaults:
  run:
    working-directory: src/XrmQuery

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: src/XrmQuery/package-lock.json
          registry-url: https://registry.npmjs.org

      - name: Resolve version from tag
        run: |
          version="${GITHUB_REF_NAME#xrmquery-v}"
          echo "Publishing @contextand/xrmquery@$version"
          npm version "$version" --no-git-tag-version --allow-same-version

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Publish to npm
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
